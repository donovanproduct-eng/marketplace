<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Маркетплейс Telegram</title>
    <link rel="stylesheet" href="style.css">
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK (Compat версии) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>

    <header class="header">
        <h1>🛍️ Маркетплейс</h1>
    </header>

    <main class="container">
        <!-- Вкладка 1: Главная (Лента) -->
        <section id="tab-home" class="tab-content active">
            <div id="products-list" class="products-grid">
                <p class="loading-text">Загрузка объявлений из базы...</p>
            </div>
        </section>

        <!-- Вкладка 2: Создать объявление -->
        <section id="tab-create" class="tab-content">
            <h2>Новое объявление</h2>
            <form id="add-product-form">
                <div class="form-group">
                    <label>Название товара</label>
                    <input type="text" id="p-title" placeholder="Например: iPhone 13 Pro" required>
                </div>
                <div class="form-group">
                    <label>Цена ($ / BYN)</label>
                    <input type="text" id="p-price" placeholder="500 $" required>
                </div>
                <div class="form-group">
                    <label>Категория</label>
                    <select id="p-category">
                        <option value="Электроника">Электроника</option>
                        <option value="Одежда">Одежда</option>
                        <option value="Услуги">Услуги</option>
                        <option value="Другое">Другое</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Описание</label>
                    <textarea id="p-desc" rows="3" placeholder="Опишите состояние товара..." required></textarea>
                </div>
                <div class="form-group">
                    <label>Ссылка на фото (URL)</label>
                    <input type="url" id="p-image" placeholder="https://..." required>
                </div>
                <button type="submit" class="btn btn-primary" id="submit-btn">Опубликовать</button>
            </form>
        </section>
    </main>

    <!-- Нижнее меню навигации -->
    <nav class="bottom-nav">
        <button class="nav-btn active" onclick="switchTab('home')">
            <span>🏠</span> Главная
        </button>
        <button class="nav-btn" onclick="switchTab('create')">
            <span>➕</span> Подать
        </button>
    </nav>

    <script src="script.js"></script>
</body>
</html>
