<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MyMarketplace</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 16px;
      padding-bottom: 100px; /* Отступ под нижнее меню */
      max-width: 500px;
      margin: 0 auto;
    }

    /* ШАПКА ПРОФИЛЯ */
    .profile-card {
      background-color: #1c1c1e;
      border-radius: 20px;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 12px;
    }

    .avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      object-fit: cover;
      margin-bottom: 12px;
    }

    .username {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .user-handle {
      color: #2f80ed;
      font-size: 15px;
      margin-bottom: 10px;
      text-decoration: none;
    }

    .verified-badge {
      background-color: rgba(52, 199, 89, 0.12);
      color: #30d158;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 20px;
      margin-bottom: 12px;
    }

    .rating-badge {
      background-color: rgba(255, 255, 255, 0.08);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 14px;
    }

    .stars { color: #ffcc00; margin: 0 4px; }
    .reviews-count { color: #8e8e93; }

    /* КАРТОЧКИ: ОБЪЯВЛЕНИЯ И ИЗБРАННОЕ */
    .stats-container {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .stat-card {
      flex: 1;
      background-color: #1c1c1e;
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      cursor: pointer;
      border: 1.5px solid transparent;
      transition: transform 0.1s ease, border-color 0.2s ease, opacity 0.1s ease;
      user-select: none;
    }

    .stat-card:active {
      transform: scale(0.97);
      opacity: 0.8;
    }

    .stat-card.active {
      border-color: #007aff;
    }

    .stat-number {
      font-size: 26px;
      font-weight: 700;
      color: #0a84ff;
      margin-bottom: 2px;
    }

    .stat-title {
      font-size: 14px;
      color: #8e8e93;
    }

    /* ВКЛАДКИ: МОИ ТОВАРЫ / ОТЗЫВЫ */
    .tab-switcher {
      display: flex;
      background-color: #1c1c1e;
      border-radius: 12px;
      padding: 2px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      color: #ffffff;
      padding: 10px 0;
      font-size: 15px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: #2c2c2e;
    }

    /* СЕТКА ТОВАРОВ */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .products-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .product-card {
      background-color: #1c1c1e;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
    }

    .product-image-container {
      position: relative;
      width: 100%;
      padding-top: 100%;
    }

    .product-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
    }

    .product-details { padding: 10px 12px 12px; }
    .product-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .product-location { font-size: 12px; color: #8e8e93; margin-bottom: 6px; }
    .product-price { font-size: 16px; font-weight: 700; color: #0a84ff; }

    /* КНОПКА ВЫХОДА */
    .logout-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: none;
      border: none;
      color: #ff453a;
      font-size: 15px;
      font-weight: 600;
      margin-top: 28px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    /* СИНЯЯ КНОПКА + */
    .fab-btn {
      position: fixed;
      bottom: 80px;
      right: 20px;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background-color: #0a84ff;
      color: #ffffff;
      font-size: 32px;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(10, 132, 255, 0.4);
      cursor: pointer;
      z-index: 90;
    }

    /* НИЖНЕЕ МЕНЮ НАВИГАЦИИ (ТАББАР) */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 65px;
      background-color: #1c1c1e;
      border-top: 0.5px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      max-width: 500px;
      margin: 0 auto;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: #8e8e93;
      text-decoration: none;
      font-size: 11px;
      cursor: pointer;
    }

    .nav-item.active {
      color: #0a84ff;
    }

    .nav-icon {
      font-size: 20px;
    }

    /* МОДАЛЬНОЕ ОКНО ТОВАРА */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }

    .modal-card {
      background-color: #1c1c1e;
      border-radius: 24px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      position: relative;
    }

    .modal-close-btn {
      position: absolute;
      top: 24px; right: 24px;
      background: rgba(0,0,0,0.5);
      border: none;
      color: white;
      width: 30px; height: 30px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 2;
    }

    .modal-img {
      width: 100%;
      height: 260px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 12px;
    }

    .modal-tags {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .tag {
      background-color: #2c2c2e;
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 10px;
      color: #8e8e93;
    }

    .tag.location { color: #0a84ff; }

    .modal-price {
      font-size: 24px;
      font-weight: 800;
      color: #0a84ff;
      margin-bottom: 4px;
    }

    .modal-item-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 14px;
    }

    /* ПЛАШКА ПРОДАВЦА В МОДАЛКЕ */
    .seller-card {
      background-color: #2c2c2e;
      border-radius: 16px;
      padding: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      user-select: none;
    }

    .seller-card:active {
      background-color: #3a3a3c;
      transform: scale(0.98);
    }

    .seller-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background-color: #555;
    }

    .seller-info-name { font-weight: 700; font-size: 15px; }
    .seller-info-handle { font-size: 13px; color: #2f80ed; }
    .seller-link { font-size: 13px; color: #0a84ff; margin-top: 2px; }

    .modal-btn {
      width: 100%;
      background-color: #2b99ff;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    .empty-msg {
      text-align: center;
      color: #8e8e93;
      padding: 40px 0;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- ПРОФИЛЬ -->
  <div class="profile-card">
    <img src="https://images.unsplash.com/photo-1511447333015-45b65e60f6d5?w=200" class="avatar" id="user-avatar" alt="Avatar">
    <div class="username" id="user-name">3YUG</div>
    <a href="#" class="user-handle" id="user-handle">@donovanproduct3</a>
    <div class="verified-badge">✓ Профиль подтверждён</div>
    <div class="rating-badge">
      <strong>4.9</strong>
      <span class="stars">★★★★★</span>
      <span class="reviews-count">(2 отзывов)</span>
    </div>
  </div>

  <!-- КАРТОЧКИ: ОБЪЯВЛЕНИЯ И ИЗБРАННОЕ -->
  <div class="stats-container">
    <div class="stat-card active" id="card-ads">
      <div class="stat-number">2</div>
      <div class="stat-title">Объявления</div>
    </div>
    <div class="stat-card" id="card-favs">
      <div class="stat-number">1</div>
      <div class="stat-title">В избранном</div>
    </div>
  </div>

  <!-- ВКЛАДКИ -->
  <div class="tab-switcher">
    <button class="tab-btn active" id="tab-btn-products">Мои товары</button>
    <button class="tab-btn" id="tab-btn-reviews">Отзывы</button>
  </div>

  <!-- СПИСКИ ТОВАРОВ -->
  <!-- 1. Мои объявления -->
  <div class="tab-content active" id="content-ads">
    <div class="products-grid">
      <div class="product-card" onclick="openModal('ваня', '3500 ₽', 'Минск', '𝖁𝖑𝖆𝖉𝖎𝖐', '@lilvfromdablock', 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400')">
        <div class="product-image-container">
          <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400" class="product-image" alt="Товар">
        </div>
        <div class="product-details">
          <div class="product-title">ваня</div>
          <div class="product-location">📍 Минск</div>
          <div class="product-price">3500 ₽</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. В избранном -->
  <div class="tab-content" id="content-favs">
    <div class="products-grid">
      <div class="product-card" onclick="openModal('Куртка Stone Island', '25000 ₽', 'Минск', 'Алексей', '@alex_store', 'https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400')">
        <div class="product-image-container">
          <img src="https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400" class="product-image" alt="Куртка">
        </div>
        <div class="product-details">
          <div class="product-title">Куртка Stone Island</div>
          <div class="product-location">📍 Минск</div>
          <div class="product-price">25000 ₽</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 3. Отзывы -->
  <div class="tab-content" id="content-reviews">
    <div class="empty-msg">У вас 2 отзыва от покупателей</div>
  </div>

  <!-- КНОПКА ВЫЙТИ И СИНЯЯ КНОПКА + -->
  <button class="logout-btn">Выйти из аккаунта</button>
  <button class="fab-btn">+</button>

  <!-- НИЖНЕЕ МЕНЮ НАВИГАЦИИ -->
  <div class="bottom-nav">
    <div class="nav-item">
      <span class="nav-icon">🛍️</span>
      <span>Объявления</span>
    </div>
    <div class="nav-item">
      <span class="nav-icon">📦</span>
      <span>Мои товары</span>
    </div>
    <div class="nav-item active">
      <span class="nav-icon">👤</span>
      <span>Профиль</span>
    </div>
  </div>

  <!-- МОДАЛЬНОЕ ОКНО ТОВАРА -->
  <div class="modal-overlay" id="product-modal" style="display: none;">
    <div class="modal-card">
      <button class="modal-close-btn" onclick="closeModal()">✕</button>
      <img src="" class="modal-img" id="modal-img" alt="Товар">
      
      <div class="modal-tags">
        <span class="tag">Другое</span>
        <span class="tag location" id="modal-location">📍 Минск</span>
      </div>

      <div class="modal-price" id="modal-price">3500 ₽</div>
      <div class="modal-item-title" id="modal-title">ваня</div>

      <!-- КЛИКАБЕЛЬНАЯ ПЛАШКА ПРОДАВЦА -->
      <div class="seller-card" id="seller-profile-btn">
        <div class="seller-avatar"></div>
        <div>
          <div class="seller-info-name" id="seller-name">𝖁𝖑𝖆𝖉𝖎𝖐</div>
          <div class="seller-info-handle" id="seller-handle">@lilvfromdablock</div>
          <div class="seller-link">Перейти в профиль продавца →</div>
        </div>
      </div>

      <button class="modal-btn">💬 Написать в Telegram</button>
    </div>
  </div>

  <!-- СКРИПТЫ -->
  <script>
    // --- ПЕРЕКЛЮЧЕНИЕ КАРТОЧЕК ("Объявления" и "В избранном") ---
    const cardAds = document.getElementById('card-ads');
    const cardFavs = document.getElementById('card-favs');
    const btnProducts = document.getElementById('tab-btn-products');
    const btnReviews = document.getElementById('tab-btn-reviews');

    const contentAds = document.getElementById('content-ads');
    const contentFavs = document.getElementById('content-favs');
    const contentReviews = document.getElementById('content-reviews');

    function resetTabs() {
      cardAds.classList.remove('active');
      cardFavs.classList.remove('active');
      btnProducts.classList.remove('active');
      btnReviews.classList.remove('active');

      contentAds.classList.remove('active');
      contentFavs.classList.remove('active');
      contentReviews.classList.remove('active');
    }

    cardAds.addEventListener('click', () => {
      resetTabs();
      cardAds.classList.add('active');
      btnProducts.classList.add('active');
      contentAds.classList.add('active');
    });

    cardFavs.addEventListener('click', () => {
      resetTabs();
      cardFavs.classList.add('active');
      contentFavs.classList.add('active');
    });

    btnProducts.addEventListener('click', () => {
      resetTabs();
      cardAds.classList.add('active');
      btnProducts.classList.add('active');
      contentAds.classList.add('active');
    });

    btnReviews.addEventListener('click', () => {
      resetTabs();
      btnReviews.classList.add('active');
      contentReviews.classList.add('active');
    });

    // --- МОДАЛКА ТОВАРА И ПЕРЕХОД НА ПРОДАВЦА ---
    const modal = document.getElementById('product-modal');
    const sellerBtn = document.getElementById('seller-profile-btn');
    let currentSellerHandle = '';
    let currentSellerName = '';

    function openModal(title, price, location, sellerName, sellerHandle, imgSrc) {
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-price').innerText = price;
      document.getElementById('modal-location').innerText = '📍 ' + location;
      document.getElementById('seller-name').innerText = sellerName;
      document.getElementById('seller-handle').innerText = sellerHandle;
      document.getElementById('modal-img').src = imgSrc;
      
      currentSellerName = sellerName;
      currentSellerHandle = sellerHandle;

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    // При клике на плашку продавца
    sellerBtn.addEventListener('click', () => {
      closeModal();

      // Меняем профиль
      document.getElementById('user-name').innerText = currentSellerName;
      document.getElementById('user-handle').innerText = currentSellerHandle;

      resetTabs();
      cardAds.classList.add('active');
      btnProducts.classList.add('active');
      contentAds.classList.add('active');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    });
  </script>
</body>
</html>
